<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine Blueprint Generator</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fdf5f8">
    <link rel="apple-touch-icon" href="icon-512.jpg">
    
    <!-- Fonts and External Scripts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Great+Vibes&family=Inter:wght@300;400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Local CSS and JS -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Collapsible Settings Panel -->
    <details id="controls" class="settings-panel">
        <summary>⚙️ Zine Settings & Styling</summary>
        <div class="settings-content">
            <div class="control-group" style="flex: 1 1 100%;">
                <label>Aesthetic Preset</label>
                <div style="display: flex; gap: 10px;">
                    <select id="aestheticPreset" style="flex: 1;">
                        <option value="custom">-- Custom --</option>
                        <option value="cherrySnow">Cherry Snow Angel</option>
                        <option value="slavicWinter">Slavic Doll Wintercore</option>
                        <option value="summerModel">Summer Model</option>
                        <option value="medicalcore">Clinical / Medicalcore</option>
                        <option value="yamiKawaii">Yami Kawaii</option>
                    </select>
                    <button class="secondary" id="savePresetBtn" style="flex: 0 1 150px; margin-top: 5px;">Save Preset</button>
                </div>
            </div>

            <div class="control-group">
                <label>Page Background</label>
                <input type="color" id="bgColor" value="#fdf5f8">
            </div>
            <div class="control-group">
                <label>Accent / Border</label>
                <input type="color" id="accentColor" value="#f1d4df">
            </div>
            <div class="control-group">
                <label>Header Font</label>
                <select id="headerFont">
                    <option value="'Playfair Display', serif">Playfair Display</option>
                    <option value="'Great Vibes', cursive">Great Vibes</option>
                    <option value="'Cinzel', serif">Cinzel</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="Arial, sans-serif">Arial</option>
                </select>
            </div>
            <div class="control-group">
                <label>Text Font</label>
                <select id="paragraphFont">
                    <option value="'Inter', sans-serif">Inter</option>
                    <option value="'Playfair Display', serif">Playfair Display</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="Georgia, serif">Georgia</option>
                </select>
            </div>
            <div class="control-group">
                <label>Layout Columns</label>
                <select id="layoutStyle">
                    <option value="1">1 Column</option>
                    <option value="2">2 Columns</option>
                    <option value="3" selected>3 Columns</option>
                    <option value="4">4 Columns</option>
                    <option value="collage" hidden>Collage</option>
                </select>
            </div>
            
            <div class="control-group" style="flex: 1 1 100%;">
                <label>Upload Sword Graphic</label>
                <input type="file" id="swordUpload" accept="image/png, image/jpeg, image/gif, image/webp">
            </div>
        </div>
    </details>

    <input type="file" id="hiddenBulkUpload" accept="image/*" multiple style="display: none;">

    <!-- The Zine Area -->
    <div class="canvas-wrapper">
        <div id="canvas-container">
            <h1 contenteditable="true" id="mainTitle">Main Title Here</h1>
            
            <div class="sword-anchor">
                <img id="swordImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='20'><line x1='0' y1='10' x2='400' y2='10' stroke='black' stroke-width='2'/><circle cx='200' cy='10' r='5' fill='black'/></svg>" alt="Sword Divider">
            </div>

            <div class="layout-grid three-col" id="mainGrid">
            </div>
        </div>
    </div>

    <!-- Sticky Bottom App Toolbar -->
    <div class="action-buttons sticky-toolbar">
        <button class="secondary" id="addTextBtn">Add Text</button>
        <button class="secondary" id="bulkUploadBtn">Images</button>
        <button class="accent" id="scrambleBtn">Scramble</button>
        <button class="success" id="downloadBtn">Save</button>
        <button class="danger" id="clearBtn">Clear</button>
    </div>

    <!-- Canvas Auto-Scaler for Mobile (Upgraded to ResizeObserver) -->
    <script>
        function adjustCanvasScale() {
            const wrapper = document.querySelector('.canvas-wrapper');
            const canvas = document.getElementById('canvas-container');
            
            // Ensure the canvas stretches naturally first
            canvas.style.height = 'auto'; 
            
            const wrapperWidth = wrapper.clientWidth;
            
            // If screen is smaller than the 800px zine, scale it down perfectly
            if (wrapperWidth > 0 && wrapperWidth < 800) {
                const scale = wrapperWidth / 800;
                canvas.style.transform = `scale(${scale})`;
                // Use scrollHeight to guarantee we grab the FULL unclipped height of all content
                wrapper.style.height = `${canvas.scrollHeight * scale}px`;
            } else {
                canvas.style.transform = 'scale(1)';
                wrapper.style.height = 'auto';
            }
        }

        window.addEventListener('load', () => {
            adjustCanvasScale();
            // Fallback sweep just in case large images take a second to load
            setTimeout(adjustCanvasScale, 500); 
        });
        window.addEventListener('resize', adjustCanvasScale);
        
        // This acts as a live sensor. Anytime an image loads, text wraps, or items are dragged, 
        // it instantly triggers the scaler to fix the wrapper height so nothing is ever cut off.
        const resizeObserver = new ResizeObserver(() => {
            adjustCanvasScale();
        });
        
        resizeObserver.observe(document.getElementById('canvas-container'));
    </script>
</body>
</html>
